global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: common

accessLog:
  format: common
  bufferingSize: 100

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: "traefik"

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      insecure: true

  websecure:
    address: ":443"

  traefik:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: platform-net
    watch: true

  file:
    directory: "/etc/traefik/dynamic"
    watch: true
