global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Traefik Edge Reverse Proxy
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics

  # Discord Bot Platform Microservices (RED Metrics)
  - job_name: 'platform-microservices'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'auth-svc:8080'
        labels:
          service: 'auth-svc'
          tier: 'control-plane'
      - targets:
          - 'catalog-svc:8081'
        labels:
          service: 'catalog-svc'
          tier: 'control-plane'
      - targets:
          - 'billing-svc:8082'
        labels:
          service: 'billing-svc'
          tier: 'control-plane'
      - targets:
          - 'deploy-svc:8083'
        labels:
          service: 'deploy-svc'
          tier: 'control-plane'
      - targets:
          - 'monitor-svc:8084'
        labels:
          service: 'monitor-svc'
          tier: 'control-plane'
