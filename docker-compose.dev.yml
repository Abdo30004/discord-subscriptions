name: discord-subscriptions-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: discord_subscriptions_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-net-dev

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: discord_subscriptions_rabbitmq_dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - platform-net-dev

  vault:
    image: hashicorp/vault:1.16
    container_name: discord_subscriptions_vault_dev
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-net-dev

  auth-svc:
    build:
      context: .
      dockerfile: microservices/auth-svc/Dockerfile
    container_name: discord_subscriptions_auth_svc_dev
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS:-auth_pass}
      AUTH_DB_NAME: auth_db
      AUTH_SVC_PORT: 8080
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-key-for-local-development-only-replace-in-production}
      SUPER_ADMIN_DISCORD_IDS: ${SUPER_ADMIN_DISCORD_IDS:-}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-root}
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - platform-net-dev

  catalog-svc:
    build:
      context: .
      dockerfile: microservices/catalog-svc/Dockerfile
    container_name: discord_subscriptions_catalog_svc_dev
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog_user}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASS:-catalog_pass}
      CATALOG_DB_NAME: catalog_db
      CATALOG_SVC_PORT: 8081
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net-dev

  billing-svc:
    build:
      context: .
      dockerfile: microservices/billing-svc/Dockerfile
    container_name: discord_subscriptions_billing_svc_dev
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${BILLING_DB_USER:-billing_user}
      POSTGRES_PASSWORD: ${BILLING_DB_PASS:-billing_pass}
      BILLING_DB_NAME: billing_db
      BILLING_SVC_PORT: 8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_MODE: sandbox
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-key-for-local-development-only-replace-in-production}
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-net-dev

  deploy-svc:
    build:
      context: .
      dockerfile: microservices/deploy-svc/Dockerfile
    container_name: discord_subscriptions_deploy_svc_dev
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DEPLOY_DB_USER:-deploy_user}
      POSTGRES_PASSWORD: ${DEPLOY_DB_PASS:-deploy_pass}
      DEPLOY_DB_NAME: deploy_db
      DEPLOY_SVC_PORT: 8083
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-root}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-key-for-local-development-only-replace-in-production}
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - platform-net-dev

  monitor-svc:
    build:
      context: .
      dockerfile: microservices/monitor-svc/Dockerfile
    container_name: discord_subscriptions_monitor_svc_dev
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${MONITOR_DB_USER:-monitor_user}
      POSTGRES_PASSWORD: ${MONITOR_DB_PASS:-monitor_pass}
      MONITOR_DB_NAME: monitor_db
      MONITOR_SVC_PORT: 8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      MONITOR_POLL_INTERVAL: ${MONITOR_POLL_INTERVAL:-15s}
      MONITOR_WORKERS: ${MONITOR_WORKERS:-5}
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-net-dev

  manager-bot:
    build:
      context: .
      dockerfile: bots/manager-bot/Dockerfile
    container_name: discord_subscriptions_manager_bot_dev
    restart: unless-stopped
    environment:
      MANAGER_BOT_TOKEN: ${MANAGER_BOT_TOKEN:-}
      MANAGER_BOT_CLIENT_ID: ${MANAGER_BOT_CLIENT_ID:-}
      TRAEFIK_URL: http://traefik
      GATEWAY_URL: http://traefik
      CATALOG_SVC_URL: http://traefik
      BILLING_SVC_URL: http://traefik
      DEPLOY_SVC_URL: http://traefik
      MONITOR_SVC_URL: http://traefik
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost}
      HEALTH_PORT: 8085
      ENABLE_SHARDING: "false"
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - platform-net-dev

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: discord_subscriptions_frontend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_AUTH_SVC_URL: ""
      NEXT_PUBLIC_CATALOG_SVC_URL: ""
      NEXT_PUBLIC_BILLING_SVC_URL: ""
      NEXT_PUBLIC_DEPLOY_SVC_URL: ""
      NEXT_PUBLIC_MONITOR_SVC_URL: ""
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      auth-svc:
        condition: service_healthy
      catalog-svc:
        condition: service_healthy
      billing-svc:
        condition: service_healthy
      deploy-svc:
        condition: service_healthy
      monitor-svc:
        condition: service_healthy
    networks:
      - platform-net-dev

  traefik:
    image: traefik:v3.1
    container_name: discord_subscriptions_traefik_dev
    restart: unless-stopped
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8090}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      auth-svc:
        condition: service_healthy
      catalog-svc:
        condition: service_healthy
      billing-svc:
        condition: service_healthy
      deploy-svc:
        condition: service_healthy
      monitor-svc:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - platform-net-dev

volumes:
  postgres_data_dev:
  rabbitmq_data_dev:

networks:
  platform-net-dev:
    driver: bridge
