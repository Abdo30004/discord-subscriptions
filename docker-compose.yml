services:
  postgres:
    image: postgres:16-alpine
    container_name: discord_subscriptions_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: discord_subscriptions_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - platform-net

  vault:
    image: hashicorp/vault:1.16
    container_name: discord_subscriptions_vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  auth-svc:
    build:
      context: .
      dockerfile: microservices/auth-svc/Dockerfile
    container_name: discord_subscriptions_auth_svc
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_DB_NAME: auth_db
      AUTH_SVC_PORT: 8080
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-super-secret-development-jwt-key-replace-in-production}
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net

  catalog-svc:
    build:
      context: .
      dockerfile: microservices/catalog-svc/Dockerfile
    container_name: discord_subscriptions_catalog_svc
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CATALOG_DB_NAME: catalog_db
      CATALOG_SVC_PORT: 8081
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net

  billing-svc:
    build:
      context: .
      dockerfile: microservices/billing-svc/Dockerfile
    container_name: discord_subscriptions_billing_svc
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BILLING_DB_NAME: billing_db
      BILLING_SVC_PORT: 8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-net

  deploy-svc:
    build:
      context: .
      dockerfile: microservices/deploy-svc/Dockerfile
    container_name: discord_subscriptions_deploy_svc
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEPLOY_DB_NAME: deploy_db
      DEPLOY_SVC_PORT: 8083
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-root}
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - platform-net

  monitor-svc:
    build:
      context: .
      dockerfile: microservices/monitor-svc/Dockerfile
    container_name: discord_subscriptions_monitor_svc
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MONITOR_DB_NAME: monitor_db
      MONITOR_SVC_PORT: 8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      MONITOR_POLL_INTERVAL: 15s
      MONITOR_WORKERS: 5
      ENV: development
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-net

  manager-bot:
    build:
      context: .
      dockerfile: bots/manager-bot/Dockerfile
    container_name: discord_subscriptions_manager_bot
    restart: unless-stopped
    environment:
      MANAGER_BOT_TOKEN: ${MANAGER_BOT_TOKEN:-}
      MANAGER_BOT_CLIENT_ID: ${MANAGER_BOT_CLIENT_ID:-}
      TRAEFIK_URL: http://traefik
      GATEWAY_URL: http://traefik
      CATALOG_SVC_URL: http://traefik
      BILLING_SVC_URL: http://traefik
      DEPLOY_SVC_URL: http://traefik
      MONITOR_SVC_URL: http://traefik
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost}
      HEALTH_PORT: 8085
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - platform-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: discord_subscriptions_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_AUTH_SVC_URL: ""
      NEXT_PUBLIC_CATALOG_SVC_URL: ""
      NEXT_PUBLIC_BILLING_SVC_URL: ""
      NEXT_PUBLIC_DEPLOY_SVC_URL: ""
      NEXT_PUBLIC_MONITOR_SVC_URL: ""
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      auth-svc:
        condition: service_healthy
      catalog-svc:
        condition: service_healthy
      billing-svc:
        condition: service_healthy
      deploy-svc:
        condition: service_healthy
      monitor-svc:
        condition: service_healthy
    networks:
      - platform-net

  traefik:
    image: traefik:v3.1
    container_name: discord_subscriptions_traefik
    restart: unless-stopped
    ports:
      - "80:80"        # Public Unified HTTP Entrypoint
      - "8090:8080"    # Traefik Web Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      auth-svc:
        condition: service_healthy
      catalog-svc:
        condition: service_healthy
      billing-svc:
        condition: service_healthy
      deploy-svc:
        condition: service_healthy
      monitor-svc:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - platform-net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  platform-net:
    driver: bridge
