name: CI - Go Microservices

on:
  push:
    branches: [ main ]
    paths:
      - 'microservices/**'
      - 'shared/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/ci-go.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'microservices/**'
      - 'shared/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/ci-go.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go Microservices & Shared Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Run Go Unit Tests
        run: |
          go test -v -race ./shared/... ./microservices/auth-svc/... ./microservices/catalog-svc/... ./microservices/billing-svc/... ./microservices/deploy-svc/... ./microservices/monitor-svc/...

      - name: Verify Binary Compilation
        run: |
          go build -o /dev/null ./microservices/auth-svc/cmd/api
          go build -o /dev/null ./microservices/catalog-svc/cmd/api
          go build -o /dev/null ./microservices/billing-svc/cmd/api
          go build -o /dev/null ./microservices/deploy-svc/cmd/api
          go build -o /dev/null ./microservices/monitor-svc/cmd/api

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m
        continue-on-error: false

      - name: Run govulncheck Vulnerability Scanner
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./shared/... ./microservices/...

