name: Release & CD Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  changelog-and-release:
    name: Create GitHub Release & Notes
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.val }}
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Release Version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "val=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate Updated CHANGELOG.md
        run: |
          node scripts/generate-changelog.mjs --version ${{ steps.version.outputs.val }}

      - name: Extract Release Notes
        id: release_notes
        run: |
          awk '/^## \[/{if (found) exit; found=1; next} found{print}' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.val }}
          tag_name: ${{ steps.version.outputs.val }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-images:
    name: Build & Push GHCR Container Images
    needs: changelog-and-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-svc
            dockerfile: microservices/auth-svc/Dockerfile
          - name: catalog-svc
            dockerfile: microservices/catalog-svc/Dockerfile
          - name: billing-svc
            dockerfile: microservices/billing-svc/Dockerfile
          - name: deploy-svc
            dockerfile: microservices/deploy-svc/Dockerfile
          - name: monitor-svc
            dockerfile: microservices/monitor-svc/Dockerfile
          - name: manager-bot
            dockerfile: bots/manager-bot/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.changelog-and-release.outputs.release_version }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
