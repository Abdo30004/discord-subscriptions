name: CI - Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go Microservices & Shared Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Run Go Unit Tests
        run: |
          go test -v -race ./shared/... ./microservices/auth-svc/... ./microservices/catalog-svc/... ./microservices/billing-svc/... ./microservices/deploy-svc/... ./microservices/monitor-svc/...

      - name: Verify Binary Compilation
        run: |
          go build -o /dev/null ./microservices/auth-svc/cmd/api
          go build -o /dev/null ./microservices/catalog-svc/cmd/api
          go build -o /dev/null ./microservices/billing-svc/cmd/api
          go build -o /dev/null ./microservices/deploy-svc/cmd/api
          go build -o /dev/null ./microservices/monitor-svc/cmd/api

  test-manager-bot:
    name: Manager Bot TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bots/manager-bot/package-lock.json

      - name: Install Dependencies
        working-directory: bots/manager-bot
        run: npm ci

      - name: Build TypeScript Manager Bot
        working-directory: bots/manager-bot
        run: npm run build

  test-frontend:
    name: Next.js 16 Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_AUTH_SVC_URL: http://localhost:8080
          NEXT_PUBLIC_CATALOG_SVC_URL: http://localhost:8081
          NEXT_PUBLIC_BILLING_SVC_URL: http://localhost:8082
          NEXT_PUBLIC_DEPLOY_SVC_URL: http://localhost:8083
          NEXT_PUBLIC_MONITOR_SVC_URL: http://localhost:8084

  validate-infra:
    name: Infrastructure & K8s Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Validate Kubernetes Manifests via Kustomize
        run: kubectl kustomize k8s/ > /dev/null

  validate-changelog:
    name: Conventional Commits & Changelog Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify CHANGELOG.md is Synchronized
        run: node scripts/generate-changelog.mjs --check

  validate-diagrams:
    name: Markdown Mermaid Diagrams Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Validation Dependencies
        run: npm ci

      - name: Validate All Mermaid Diagrams
        run: node scripts/validate-diagrams.mjs

