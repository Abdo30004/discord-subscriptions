apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-svc-sa
  namespace: platform
  labels:
    app.kubernetes.io/name: deploy-svc
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: discord-subscriptions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploy-svc-cluster-role
  labels:
    app.kubernetes.io/name: deploy-svc
    app.kubernetes.io/part-of: discord-subscriptions
rules:
  # Namespaces management (ensureNamespace in discord-bots)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]

  # Deployments management for customer bots
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Core resources: Services, Pods, Logs, PVCs for bot workloads
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log", "pods/status", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploy-svc-cluster-rolebinding
  labels:
    app.kubernetes.io/name: deploy-svc
    app.kubernetes.io/part-of: discord-subscriptions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deploy-svc-cluster-role
subjects:
  - kind: ServiceAccount
    name: deploy-svc-sa
    namespace: platform
