# k8s/03-secrets.example.yaml
# Copy this file to k8s/03-secrets.yaml and replace all placeholder values with production credentials.
# In production, prefer using External Secrets Operator with HashiCorp Vault or Bitnami Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform
  labels:
    app.kubernetes.io/part-of: discord-subscriptions
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-this-secure-postgres-password"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASS: "guest"
  VAULT_DEV_ROOT_TOKEN: "root"
  JWT_SECRET: "super-secure-production-jwt-secret-key-at-least-32-chars-long"
  DISCORD_CLIENT_ID: "your_discord_oauth_client_id"
  DISCORD_CLIENT_SECRET: "your_discord_oauth_client_secret"
  SUPER_ADMIN_DISCORD_IDS: "your_discord_snowflake_id"
  MANAGER_BOT_TOKEN: "your_discord_manager_bot_token"
  MANAGER_BOT_CLIENT_ID: "your_discord_manager_bot_client_id"
  PAYPAL_CLIENT_ID: "your_paypal_client_id"
  PAYPAL_CLIENT_SECRET: "your_paypal_client_secret"
  PAYPAL_WEBHOOK_ID: "your_paypal_webhook_id"
  PAYPAL_MODE: "sandbox"
