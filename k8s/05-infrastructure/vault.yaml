apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: platform
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.16
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          ports:
            - name: vault
              containerPort: 8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: VAULT_DEV_ROOT_TOKEN
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
          volumeMounts:
            - name: vault-storage
              mountPath: /vault/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: vault-storage
          persistentVolumeClaim:
            claimName: vault-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: platform
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  type: ClusterIP
  ports:
    - name: vault
      port: 8200
      targetPort: 8200
  selector:
    app.kubernetes.io/name: vault
