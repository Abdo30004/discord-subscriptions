apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-svc
  namespace: platform
  labels:
    app.kubernetes.io/name: monitor-svc
    app.kubernetes.io/component: watchdog
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monitor-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitor-svc
    spec:
      containers:
        - name: monitor-svc
          image: ghcr.io/discord-subscriptions/monitor-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: MONITOR_SVC_PORT
              value: "8084"
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: LOG_LEVEL
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_PORT
            - name: MONITOR_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: MONITOR_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MONITOR_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MONITOR_DB_PASS
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_PASS
            - name: MONITOR_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: MONITOR_POLL_INTERVAL
            - name: MONITOR_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: MONITOR_WORKERS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-svc
  namespace: platform
  labels:
    app.kubernetes.io/name: monitor-svc
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8084
      targetPort: 8084
  selector:
    app.kubernetes.io/name: monitor-svc
