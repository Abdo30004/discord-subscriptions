apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-svc
  namespace: platform
  labels:
    app.kubernetes.io/name: billing-svc
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-svc
    spec:
      containers:
        - name: billing-svc
          image: ghcr.io/discord-subscriptions/billing-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: BILLING_SVC_PORT
              value: "8082"
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: LOG_LEVEL
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_PORT
            - name: BILLING_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: BILLING_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_PASS
            - name: PAYPAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PAYPAL_CLIENT_ID
            - name: PAYPAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PAYPAL_CLIENT_SECRET
            - name: PAYPAL_WEBHOOK_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PAYPAL_WEBHOOK_ID
            - name: PAYPAL_MODE
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: PAYPAL_MODE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: billing-svc
  namespace: platform
  labels:
    app.kubernetes.io/name: billing-svc
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app.kubernetes.io/name: billing-svc
