apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-svc
  namespace: platform
  labels:
    app.kubernetes.io/name: catalog-svc
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-svc
    spec:
      containers:
        - name: catalog-svc
          image: ghcr.io/discord-subscriptions/catalog-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: CATALOG_SVC_PORT
              value: "8081"
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: LOG_LEVEL
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_PORT
            - name: CATALOG_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: CATALOG_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: CATALOG_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: CATALOG_DB_PASS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-svc
  namespace: platform
  labels:
    app.kubernetes.io/name: catalog-svc
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app.kubernetes.io/name: catalog-svc
