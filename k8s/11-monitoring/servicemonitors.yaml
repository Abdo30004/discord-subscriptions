apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-microservices-monitor
  namespace: platform
  labels:
    release: prometheus
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: microservice
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
