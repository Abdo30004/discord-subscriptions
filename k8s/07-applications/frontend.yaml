apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: platform
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web-ui
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/discord-subscriptions/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_AUTH_SVC_URL
              value: "/api/v1/auth"
            - name: NEXT_PUBLIC_CATALOG_SVC_URL
              value: "/api/v1/catalog"
            - name: NEXT_PUBLIC_BILLING_SVC_URL
              value: "/api/v1/billing"
            - name: NEXT_PUBLIC_DEPLOY_SVC_URL
              value: "/api/v1/deploy"
            - name: NEXT_PUBLIC_MONITOR_SVC_URL
              value: "/api/v1/monitor"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: platform
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: frontend
