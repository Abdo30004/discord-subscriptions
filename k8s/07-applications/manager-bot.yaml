apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager-bot
  namespace: platform
  labels:
    app.kubernetes.io/name: manager-bot
    app.kubernetes.io/component: discord-bot
    app.kubernetes.io/part-of: discord-subscriptions
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: manager-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manager-bot
    spec:
      containers:
        - name: manager-bot
          image: ghcr.io/discord-subscriptions/manager-bot:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: MANAGER_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MANAGER_BOT_TOKEN
            - name: MANAGER_BOT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MANAGER_BOT_CLIENT_ID
            - name: CATALOG_SVC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: CATALOG_SVC_URL
            - name: BILLING_SVC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: BILLING_SVC_URL
            - name: DEPLOY_SVC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DEPLOY_SVC_URL
            - name: MONITOR_SVC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: MONITOR_SVC_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - name: health
              containerPort: 8085
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 15
