apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-ingress
    app.kubernetes.io/part-of: discord-subscriptions
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - bots.example.com
      secretName: platform-tls-cert
  rules:
    - host: bots.example.com
      http:
        paths:
          # Microservices REST API Routing
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-svc
                port:
                  number: 8080

          - path: /api/v1/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-svc
                port:
                  number: 8081

          - path: /api/v1/subscriptions
            pathType: Prefix
            backend:
              service:
                name: billing-svc
                port:
                  number: 8082

          - path: /api/v1/promos
            pathType: Prefix
            backend:
              service:
                name: billing-svc
                port:
                  number: 8082

          - path: /api/v1/vouchers
            pathType: Prefix
            backend:
              service:
                name: billing-svc
                port:
                  number: 8082

          - path: /api/v1/webhooks
            pathType: Prefix
            backend:
              service:
                name: billing-svc
                port:
                  number: 8082

          - path: /api/v1/deployments
            pathType: Prefix
            backend:
              service:
                name: deploy-svc
                port:
                  number: 8083

          - path: /api/v1/token-pool
            pathType: Prefix
            backend:
              service:
                name: deploy-svc
                port:
                  number: 8083

          - path: /api/v1/targets
            pathType: Prefix
            backend:
              service:
                name: monitor-svc
                port:
                  number: 8084

          # Next.js Web Dashboard & Store
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
